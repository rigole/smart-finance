<div class="page">


    <div class="page-header">
        <div>
            <h1> AI Insights</h1>
            <p>Smart analysis of your financial habits</p>
        </div>
        <button mat-raised-button color="primary" (click)="generateInsights()" [disabled]="loading">
            <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
            <mat-icon *ngIf="!loading">auto_awesome</mat-icon>
            {{ loading ? 'Generating...' : 'Generate Insights' }}
        </button>
    </div>

    <div class="center" *ngIf="loading">
        <mat-spinner></mat-spinner>
    </div>

    
    <mat-card class="empty-state" *ngIf="insights.length === 0">
        <mat-card-content>
            <mat-icon>psychology</mat-icon>
            <h2>No insights yet</h2>
            <p>Click "Generate Insights" to get AI-powered
                analysis of your finances!</p>
            <button mat-raised-button color="primary" (click)="generateInsights()">
                <mat-icon>auto_awesome</mat-icon>
                Generate Now
            </button>
        </mat-card-content>
    </mat-card>

    
    <div class="insights-grid">
        <mat-card class="insight-card" *ngFor="let insight of insights">
            <mat-card-content>
                <div class="insight-header">
                    <div class="insight-icon" [style.background]="getColor(insight.type) + '20'"
                        [style.color]="getColor(insight.type)">
                        <mat-icon>{{ getIcon(insight.type) }}</mat-icon>
                    </div>
                    <span class="insight-type">{{ insight.type }}</span>
                </div>
                <p class="insight-message">{{ insight.message }}</p>
                <span class="insight-date">
                    {{ insight.generatedAt | date:'medium' }}
                </span>
            </mat-card-content>
        </mat-card>
    </div>

</div>
