
<button mat-button [matMenuTriggerFor]="langMenu">
    <mat-icon>language</mat-icon>
    {{ currentLang === 'fr' ? '🇫🇷 FR' : '🇬🇧 EN' }}
</button>

<mat-menu #langMenu="matMenu">
    <button mat-menu-item (click)="switchLang('en')">
         English
    </button>
    <button mat-menu-item (click)="switchLang('fr')">
        Français
    </button>
</mat-menu>
